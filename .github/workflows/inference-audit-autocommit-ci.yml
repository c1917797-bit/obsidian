name: inference-audit-autocommit-ci

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [ main ]

jobs:
  audit-and-commit:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run scan
        id: scan
        shell: pwsh
        run: |
          $out = & pwsh .\0_Codex工作台\tools\inference-audit.ps1 scan
          $out | Out-File -FilePath scan-output.txt -Encoding UTF8
          $out | Write-Output

          $badLine = ($out | Select-String '^BAD=')
          if (-not $badLine) { throw 'scan failed to output BAD' }
          $bad = [int]($badLine.ToString() -replace '^BAD=', '')
          if ($bad -gt 0) { Write-Output "BAD=$bad detected"; exit 1 }

      - name: Generate report
        shell: pwsh
        run: |
          pwsh .\0_Codex工作台\tools\inference-audit.ps1 report

      - name: Archive weekly report on weekends and commit updates
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          $reportPath = "3_AI情报日历/Inbox/InferenceRadar/问题清单.md"
          git add $reportPath

          $today = Get-Date
          $isWeekend = @("Saturday", "Sunday") -contains $today.DayOfWeek.ToString()
          if ($isWeekend) {
            $archiveDir = "3_AI情报日历/Inbox/InferenceRadar/问题清单_归档"
            New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null
            $weekTag = $today.ToString("yyyy-MM-dd")
            $archivePath = Join-Path $archiveDir ("问题清单_周报_" + $weekTag + ".md")
            Copy-Item -Path $reportPath -Destination $archivePath -Force
            git add $archivePath
            Write-Output ("Weekend archive synced: " + $archivePath)
          } else {
            Write-Output "Not weekend. Keep only live report sync in commit."
          }

          $status = git status --short
          if (-not [string]::IsNullOrWhiteSpace($status)) {
            if($isWeekend){
              git commit -m "chore: sync and archive inference audit report"
            } else {
              git commit -m "chore: sync inference audit report"
            }
            git push
          } else {
            Write-Output "No report changes detected. Skip commit."
          }
